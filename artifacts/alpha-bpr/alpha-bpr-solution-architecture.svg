<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Alpha BPR — архитектура решения</title>
  <desc id="desc">Read-only архитектура Alpha BPR: источники, Alpha Platform, интеграция, приложение, пользователи и Track F.</desc>
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.t{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#64748b}.zt{font-size:13px;font-weight:700;letter-spacing:1px;fill:#64748b}.h{font-size:17px;font-weight:700}.b{font-size:13px;fill:#475569}.s{font-size:11.5px;fill:#64748b}.zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2}.node{stroke:#94a3b8;stroke-width:1.2}.src{fill:#fef3c7}.platform{fill:#dbeafe}.int{fill:#e0e7ff}.store{fill:#ccfbf1}.ui{fill:#dcfce7}.neutral{fill:#f1f5f9}.live{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#ab)}.hist{fill:none;stroke:#0f766e;stroke-width:2.2;marker-end:url(#at)}.ctl{fill:none;stroke:#b45309;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#aa)}.test{fill:none;stroke:#475569;stroke-width:1.8;stroke-dasharray:4 5;marker-end:url(#as)}
