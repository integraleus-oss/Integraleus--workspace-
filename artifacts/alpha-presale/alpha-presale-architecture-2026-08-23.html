<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Архитектура решения Alpha-Presale</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#98a2b3; --blue:#175cd3; --blue-bg:#eff8ff; --cyan:#0e7090; --cyan-bg:#ecfdff; --green:#067647; --green-bg:#ecfdf3; --amber:#b54708; --amber-bg:#fffaeb; --purple:#6941c6; --purple-bg:#f4f3ff; --gray-bg:#f8fafc; --red:#b42318; --red-bg:#fef3f2; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eef2f6; color:var(--ink); font-family:Inter,Segoe UI,Arial,sans-serif; }
    main { width:min(1540px, calc(100vw - 32px)); margin:20px auto; background:white; border:1px solid #d0d5dd; border-radius:20px; box-shadow:0 16px 40px rgba(16,24,40,.10); overflow:hidden; }
    header { padding:28px 34px 20px; border-bottom:1px solid #eaecf0; }
    h1 { margin:0 0 7px; font-size:30px; letter-spacing:-.4px; }
    header p { margin:0; color:var(--muted); font-size:15px; }
    svg { display:block; width:100%; height:auto; background:#fff; }
    .zone { fill:#fbfcfe; stroke:#d0d5dd; stroke-width:1.5; }
    .zone-title { font-size:14px; font-weight:700; fill:#475467; letter-spacing:.55px; }
    .node { stroke-width:1.8; rx:13; }
    .input { fill:var(--blue-bg); stroke:#84caff; }
    .process { fill:var(--cyan-bg); stroke:#67e3f9; }
    .decision { fill:var(--amber-bg); stroke:#fec84b; }
    .storage { fill:var(--purple-bg); stroke:#bdb4fe; }
    .output { fill:var(--green-bg); stroke:#75e0a7; }
    .external { fill:var(--gray-bg); stroke:#98a2b3; stroke-dasharray:7 5; }
    .future { fill:var(--red-bg); stroke:#f97066; stroke-dasharray:8 5; }
    .title { font-size:17px; font-weight:700; fill:var(--ink); }
    .body { font-size:13px; fill:#344054; }
    .small { font-size:12px; fill:#475467; }
    .connector { fill:none; stroke:#667085; stroke-width:2; marker-end:url(#arrow); }
    .connector-soft { fill:none; stroke:#98a2b3; stroke-width:1.8; stroke-dasharray:6 5; marker-end:url(#arrow-soft); }
    .boundary { fill:none; stroke:#f79009; stroke-width:2.5; stroke-dasharray:10 6; }
    .pill { rx:10; }
    .pill-text { font-size:12px; font-weight:700; }
    footer { display:flex; gap:22px; flex-wrap:wrap; padding:17px 30px 22px; color:#475467; font-size:13px; border-top:1px solid #eaecf0; }
    .legend { display:flex; align-items:center; gap:7px; }
    .swatch { width:16px; height:12px; border-radius:3px; border:1.5px solid; }
    @media print { body{background:white} main{width:100%;margin:0;border:0;box-shadow:none} }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Архитектура решения Alpha-Presale</h1>
    <p>От входных данных заказчика до проверенного технического отчёта и передачи в защищённый расчётный контур</p>
  </header>
  <svg viewBox="0 0 1500 920" role="img" aria-labelledby="svgTitle svgDesc">
    <title id="svgTitle">Архитектура Alpha-Presale</title>
    <desc id="svgDesc">Схема слева направо: пользователи и источники, защищённый веб-доступ, intake и review, расчётное ядро без цен, результаты и будущий финансовый контур.</desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker>
      <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#98a2b3"/></marker>
    </defs>

    <!-- Connectors are intentionally drawn before nodes. -->
    <path class="connector" d="M248 246 H315"/>
    <path class="connector" d="M248 402 H315"/>
    <path class="connector" d="M478 321 H535"/>
    <path class="connector" d="M700 321 H750"/>
    <path class="connector" d="M920 321 H970"/>
    <path class="connector" d="M1140 321 H1192"/>
    <path class="connector" d="M835 430 V515"/>
    <path class="connector" d="M1055 430 V515"/>
    <path class="connector" d="M1280 430 V515"/>
    <path class="connector-soft" d="M1055 660 V748 H1190"/>
    <path class="connector-soft" d="M1280 660 V748 H1350"/>
    <path class="connector-soft" d="M835 660 V790 H1190"/>
    <path class="connector-soft" d="M625 430 V750 H970"/>

    <!-- Zones -->
    <rect class="zone" x="28" y="78" width="240" height="500" rx="18"/>
    <text class="zone-title" x="52" y="111">1 · ВХОДНЫЕ ДАННЫЕ</text>
    <rect class="zone" x="292" y="78" width="210" height="500" rx="18"/>
    <text class="zone-title" x="316" y="111">2 · ДОСТУП</text>
    <rect class="zone" x="522" y="78" width="630" height="610" rx="18"/>
    <text class="zone-title" x="546" y="111">3 · ALPHA-PRESALE · ТЕКУЩИЙ КОНТУР</text>
    <rect class="zone" x="1172" y="78" width="300" height="610" rx="18"/>
    <text class="zone-title" x="1196" y="111">4 · РЕЗУЛЬТАТЫ</text>

    <!-- Inputs -->
    <rect class="node input" x="50" y="150" width="198" height="135"/>
    <text class="title" x="74" y="182">Инженер Presale</text>
    <text class="body" x="74" y="211"><tspan x="74" dy="0">• проходит мастер вопросов</tspan><tspan x="74" dy="22">• подтверждает факты</tspan><tspan x="74" dy="22">• закрывает блокеры</tspan></text>
    <rect class="node input" x="50" y="325" width="198" height="154"/>
    <text class="title" x="74" y="357">Материалы проекта</text>
    <text class="body" x="74" y="386"><tspan x="74" dy="0">JSON · XLSX · CSV · TSV</tspan><tspan x="74" dy="22">TXT · MD · I/O list</tspan><tspan x="74" dy="22">или ручной ввод</tspan><tspan x="74" dy="22">нестандартных протоколов</tspan></text>

    <!-- Access -->
    <rect class="node external" x="315" y="195" width="163" height="252"/>
    <text class="title" x="339" y="228">Веб-шлюз</text>
    <text class="body" x="339" y="260"><tspan x="339" dy="0">HTTPS</tspan><tspan x="339" dy="23">Basic Auth</tspan><tspan x="339" dy="23">reverse proxy</tspan><tspan x="339" dy="23">публичный стенд</tspan></text>
    <rect class="pill" x="338" y="365" width="116" height="29" fill="#ecfdf3" stroke="#75e0a7"/>
    <text class="pill-text" x="396" y="384" text-anchor="middle" fill="#067647">401 без доступа</text>

    <!-- Current contour main row -->
    <rect class="node process" x="545" y="195" width="155" height="235"/>
    <text class="title" x="569" y="227">Web UI</text>
    <text class="body" x="569" y="257"><tspan x="569" dy="0">мастер вопросов</tspan><tspan x="569" dy="22">выбор протоколов</tspan><tspan x="569" dy="22">ручной ввод</tspan><tspan x="569" dy="22">локальное состояние</tspan><tspan x="569" dy="22">предпросмотр результата</tspan></text>

    <rect class="node process" x="750" y="195" width="170" height="235"/>
    <text class="title" x="774" y="227">Intake &amp; Review</text>
    <text class="body" x="774" y="257"><tspan x="774" dy="0">разбор файлов</tspan><tspan x="774" dy="22">нормализация фактов</tspan><tspan x="774" dy="22">accepted input</tspan><tspan x="774" dy="22">scope diff</tspan><tspan x="774" dy="22">вопросы и конфликты</tspan></text>

    <rect class="node decision" x="970" y="195" width="170" height="235"/>
    <text class="title" x="994" y="227">Расчётное ядро</text>
    <text class="body" x="994" y="257"><tspan x="994" dy="0">валидация</tspan><tspan x="994" dy="22">расчёт тегов</tspan><tspan x="994" dy="22">выбор семейства</tspan><tspan x="994" dy="22">драйверы и draft SKU</tspan><tspan x="994" dy="22">readiness checks</tspan></text>

    <!-- Supporting components -->
    <rect class="node storage" x="555" y="515" width="140" height="145"/>
    <text class="title" x="579" y="547">Контракты</text>
    <text class="body" x="579" y="577"><tspan x="579" dy="0">JSON Schema</tspan><tspan x="579" dy="22">PresaleInput</tspan><tspan x="579" dy="22">PresaleResult</tspan></text>

    <rect class="node storage" x="760" y="515" width="150" height="145"/>
    <text class="title" x="784" y="547">Источники SKU</text>
    <text class="body" x="784" y="577"><tspan x="784" dy="0">read-only индекс</tspan><tspan x="784" dy="22">доступность</tspan><tspan x="784" dy="22">без цен</tspan></text>

    <rect class="node process" x="980" y="515" width="150" height="145"/>
    <text class="title" x="1004" y="547">Python API</text>
    <text class="body" x="1004" y="577"><tspan x="1004" dy="0">validate · calc</tspan><tspan x="1004" dy="22">import · report</tspan><tspan x="1004" dy="22">единая бизнес-логика</tspan></text>

    <!-- Results -->
    <rect class="node output" x="1192" y="195" width="256" height="235"/>
    <text class="title" x="1216" y="227">Рабочий результат</text>
    <text class="body" x="1216" y="258"><tspan x="1216" dy="0">• семейство: One+ / SCADA / Platform</tspan><tspan x="1216" dy="22">• теги, драйверы, draft позиции</tspan><tspan x="1216" dy="22">• вопросы, риски, допущения</tspan><tspan x="1216" dy="22">• blocked / draft_only / ready_for_calc</tspan><tspan x="1216" dy="22">• текстовая передача + JSON</tspan></text>

    <rect class="node output" x="1192" y="515" width="256" height="145"/>
    <text class="title" x="1216" y="547">Итоговый техотчёт</text>
    <text class="body" x="1216" y="578"><tspan x="1216" dy="0">Word (.docx)</tspan><tspan x="1216" dy="22">Excel (.xlsx)</tspan><tspan x="1216" dy="22">PDF (.pdf)</tspan></text>

    <!-- Boundary and future -->
    <path class="boundary" d="M935 714 H1460"/>
    <rect x="966" y="695" width="294" height="36" rx="18" fill="#fffaeb" stroke="#fec84b"/>
    <text class="pill-text" x="1113" y="718" text-anchor="middle" fill="#b54708">КОНТРОЛЬНАЯ ГРАНИЦА: БЕЗ ЦЕН</text>

    <rect class="node future" x="970" y="758" width="220" height="122"/>
    <text class="title" x="994" y="790">Hard-check контур</text>
    <text class="body" x="994" y="819"><tspan x="994" dy="0">правила лицензирования</tspan><tspan x="994" dy="22">проверка комплектности</tspan></text>

    <rect class="node future" x="1230" y="758" width="218" height="122"/>
    <text class="title" x="1254" y="790">Финансы и ТКП</text>
    <text class="body" x="1254" y="819"><tspan x="1254" dy="0">цены · скидки · НДС</tspan><tspan x="1254" dy="22">условия · согласование</tspan></text>

    <text class="small" x="548" y="680">Один подтверждённый набор данных → один расчётный путь → несколько форматов результата</text>
  </svg>
  <footer>
    <span class="legend"><span class="swatch" style="background:#eff8ff;border-color:#84caff"></span> вход</span>
    <span class="legend"><span class="swatch" style="background:#ecfdff;border-color:#67e3f9"></span> обработка</span>
    <span class="legend"><span class="swatch" style="background:#f4f3ff;border-color:#bdb4fe"></span> контракты/источники</span>
    <span class="legend"><span class="swatch" style="background:#ecfdf3;border-color:#75e0a7"></span> результат</span>
    <span class="legend"><span class="swatch" style="background:#fef3f2;border-color:#f97066"></span> следующий защищённый этап</span>
  </footer>
</main>
</body>
</html>
