[project]
name = "openclaw-shared-memory"
version = "0.1.0"
description = "Shared canonical memory infrastructure for OpenClaw agents"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
openclaw-memory-server = "openclaw_shared_memory.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
