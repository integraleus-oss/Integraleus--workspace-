services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openclaw-shared-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openclaw_memory
      POSTGRES_USER: openclaw_memory
      POSTGRES_PASSWORD: openclaw_memory_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - openclaw_shared_memory_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw_memory -d openclaw_memory"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  openclaw_shared_memory_pgdata:
